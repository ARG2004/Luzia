name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'


      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Luzia-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Android Bundle AAB
        uses: actions/upload-artifact@v4
        with:
          name: Luzia-Android-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
