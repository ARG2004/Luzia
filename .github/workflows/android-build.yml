name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Android Keystore from Secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/luzia-release.jks
          echo "Keystore restaurado. Verificando tamaño..."
          ls -la android/app/luzia-release.jks
          cat <<EOF > keystore.properties
          storeFile=android/app/luzia-release.jks
          storePassword=Luzia2026!
          keyAlias=luzia
          keyPassword=Luzia2026!
          EOF
          cp keystore.properties android/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'luzia' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB for Google Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'luzia' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon


      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Luzia-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1

      - name: Upload Android Bundle AAB
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Luzia-Android-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 1

      - name: Publish APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Luzía Mobile Build"
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
